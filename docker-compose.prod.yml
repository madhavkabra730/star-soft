# Production-style run: builds the "runner" stage (Next.js standalone
# output) instead of the hot-reloading dev server.
#
# Usage: docker compose -f docker-compose.prod.yml up --build
services:
  web:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
