services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Point this at a real backend to bypass the local mock API
      # (see README → "Why a mock API"). Defaults to the built-in
      # /api/products Route Handlers when unset.
      # NEXT_PUBLIC_API_BASE_URL: https://your-api.example.com/v1
    volumes:
      - .:/app
      # Anonymous volumes so the container's own (Linux) node_modules and
      # .next build output aren't shadowed by the host bind mount above.
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
